# ruff 配置(与 chatbi 同口径):E4/E7/E9 + F + I + B;不 gate 格式化。
# data/ 下是仓储的 FastAPI 文档语料(含大量刻意不完整的示例 py),不参与 lint。
line-length = 120
target-version = "py313"
extend-exclude = ["data", "web", "rag-qa-backup-*", "eval/runs", ".venv", "__pycache__"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[lint.per-file-ignores]
# 这几个脚本按"先 sys.path.insert 再 import 项目模块"的顺序写,import 不在文件顶部是刻意的
"scripts/build_index.py" = ["E402"]
"scripts/inspect_chunks.py" = ["E402"]
"scripts/smoke_env_phase2.py" = ["E402"]