services:
  api:
    build: .
    image: rag-qa:latest
    command: python -m uvicorn app.api:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      - HF_HOME=/models  # 覆盖 .env 里的宿主机 Windows 路径
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/models
    restart: unless-stopped

volumes:
  hf-cache:
