services:
  api:
    build: .
    image: rag-qa:latest
    command: python -m uvicorn app.api:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/models
    restart: unless-stopped

  ui:
    image: rag-qa:latest
    command: streamlit run app/ui.py --server.address 0.0.0.0 --server.port 8501 --browser.gatherUsageStats false
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - hf-cache:/models
    restart: unless-stopped
    depends_on:
      - api

volumes:
  hf-cache:
